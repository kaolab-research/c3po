[project]
name = "c3po"
version = "0.1.0"
description = "Human-facing protocol droid — lightweight client library for N-Droids robot stations"
readme = "README.md"
authors = [
    { name = "Andy Wang", email = "andywang0321@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
    "websocket-client>=1.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "websockets>=12",   # for mock r2d2 server in tests
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
